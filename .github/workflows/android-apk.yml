
name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK and accept licenses
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          sudo apt-get update
          sudo apt-get install -y wget unzip

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mkdir -p /tmp/android-tools

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
yes | "$SDKMANAGER" \
  --sdk_root="$ANDROID_HOME" --licenses
set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -e
          test -f JarvisAndroid_CloudBuild.zip
          mkdir -p source
          unzip -q JarvisAndroid_CloudBuild.zip -d source

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find source -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

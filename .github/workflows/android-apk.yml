
name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "/usr/lib/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Locate project
        run: |
          unzip -q JarvisAndroid_CloudBuild.zip -d source
          find source -maxdepth 4 -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: source/**/build/outputs/apk/debug/*.apk
